<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>滑动窗口滤波 · 机器人感知实验台</title>
<style>
  :root {
    --ink: #10243e;
    --ink-soft: #334b66;
    --muted: #6a7f97;
    --line: #dbe6f1;
    --paper: #ffffff;
    --bg: #f3f7fb;
    --teal: #0f9d76;
    --orange: #f59e0b;
    --indigo: #3b5bdb;
    --indigo-deep: #2b45ab;
    --shadow: 0 20px 55px rgba(27, 57, 89, .08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    color: var(--ink);
    font-family: "Noto Sans SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(circle at 8% 0%, rgba(59, 91, 219, .11), transparent 30%),
      radial-gradient(circle at 96% 10%, rgba(15, 157, 118, .10), transparent 28%),
      linear-gradient(180deg, #f7faff 0%, var(--bg) 45%, #f6f9fc 100%);
    min-height: 100vh;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .38;
    background-image:
      linear-gradient(rgba(80, 112, 148, .05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(80, 112, 148, .05) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: linear-gradient(to bottom, black, transparent 78%);
  }

  .page {
    width: min(1360px, 100%);
    margin: 0 auto;
    padding: 28px 30px 44px;
    position: relative;
  }

  /* ---------- 标题 ---------- */
  .hero {
    position: relative;
    overflow: hidden;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 30px;
    align-items: center;
    min-height: 232px;
    padding: 34px 44px;
    border-radius: 30px;
    color: #edf6ff;
    background:
      radial-gradient(circle at 78% 10%, rgba(56, 189, 248, .22), transparent 32%),
      radial-gradient(circle at 10% 105%, rgba(16, 185, 129, .17), transparent 38%),
      linear-gradient(118deg, #0a1c33 0%, #0f2b4b 48%, #103b4a 100%);
    box-shadow: 0 28px 70px rgba(11, 31, 56, .23);
  }

  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .22;
    background-image:
      linear-gradient(rgba(148, 190, 225, .18) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148, 190, 225, .18) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: linear-gradient(90deg, black, transparent 72%);
  }

  .hero::after {
    content: "";
    position: absolute;
    width: 300px;
    height: 300px;
    right: -100px;
    bottom: -190px;
    border-radius: 50%;
    background: rgba(56, 189, 248, .18);
    filter: blur(20px);
  }

  .hero h1 {
    position: relative;
    z-index: 1;
    margin: 0;
    font-size: clamp(42px, 6.1vw, 72px);
    line-height: 1.03;
    letter-spacing: -.05em;
    font-weight: 850;
  }

  .hero h1 em {
    font-style: normal;
    color: #67e8f9;
    text-shadow: 0 0 34px rgba(103, 232, 249, .25);
  }

  .hero-art {
    position: relative;
    z-index: 1;
    width: clamp(120px, 20vw, 258px);
    transform: rotate(-1.6deg);
  }

  .hero-art::before {
    content: "";
    position: absolute;
    inset: 10% -8% -10% -8%;
    border-radius: 36%;
    background: rgba(103, 232, 249, .13);
    filter: blur(24px);
  }

  .hero-art img {
    position: relative;
    display: block;
    width: 100%;
    height: auto;
    border-radius: 24px;
    border: 5px solid rgba(255, 255, 255, .94);
    background: #fff;
    box-shadow: 0 22px 55px rgba(0, 0, 0, .28);
  }

  /* ---------- 固定滑动平均动画 ---------- */
  .fixed-demo {
    margin-top: 20px;
    padding: 19px 24px 18px;
    border-radius: 24px;
    border: 1px solid rgba(211, 225, 239, .95);
    background: rgba(255, 255, 255, .95);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .demo-head,
  .avg-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .demo-head { margin-bottom: 9px; }

  .demo-label {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .1em;
  }

  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 0 4px rgba(16, 185, 129, .11);
  }

  .window-tag {
    padding: 5px 10px;
    border-radius: 999px;
    background: #eef2ff;
    border: 1px solid #dbe2ff;
    color: #3451c7;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .04em;
  }

  .raw-stream,
  .avg-stream {
    display: flex;
    gap: 8px;
    min-width: 0;
  }

  .num-chip,
  .avg-chip {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 44px;
    padding: 0 3px;
    border-radius: 10px;
    border: 1px solid transparent;
    font-size: 13px;
    font-weight: 750;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
    overflow: hidden;
    white-space: nowrap;
  }

  .num-chip {
    background: #f4f7fb;
    border-color: #eaf0f7;
    color: #9aacbe;
  }

  .num-chip.in-window {
    background: #eef2ff;
    border-color: #d9e1ff;
    color: var(--indigo-deep);
    box-shadow: inset 0 -2px 0 rgba(59, 91, 219, .10);
  }

  .avg-chip {
    height: 39px;
    background: #ecfbf5;
    border-color: #d5f3e6;
    color: #087f5b;
  }

  .chip-enter { animation: chipEnter .38s cubic-bezier(.22, .9, .35, 1.12); }

  @keyframes chipEnter {
    from { opacity: 0; transform: translateX(15px) scale(.94); }
    to { opacity: 1; transform: translateX(0) scale(1); }
  }

  .demo-bottom {
    display: grid;
    grid-template-columns: minmax(158px, 192px) minmax(0, 1fr);
    gap: 14px;
    align-items: stretch;
    margin-top: 12px;
  }

  .avg-now {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 14px;
    color: #eaf4ff;
    background: linear-gradient(135deg, #18375a, #0f2a47);
    box-shadow: 0 8px 20px rgba(15, 42, 71, .15);
  }

  .avg-now span {
    color: #9fb9d1;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .05em;
    white-space: nowrap;
  }

  .avg-now strong {
    color: #fff;
    font-size: 24px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.03em;
    white-space: nowrap;
  }

  .avg-head { margin-bottom: 7px; }

  /* ---------- 主实验区 ---------- */
  .workbench {
    display: grid;
    grid-template-columns: minmax(0, 1.72fr) minmax(348px, .78fr);
    gap: 20px;
    margin-top: 20px;
    align-items: start;
  }

  .panel {
    background: rgba(255, 255, 255, .94);
    border: 1px solid rgba(211, 225, 239, .9);
    border-radius: 24px;
    box-shadow: var(--shadow);
  }

  .chart-panel {
    display: flex;
    flex-direction: column;
    padding: 22px 26px 20px;
    min-width: 0;
    overflow: hidden;
  }

  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }

  .panel h2 {
    margin: 0;
    font-size: 22px;
    font-weight: 850;
    letter-spacing: -.02em;
  }

  .status-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
    padding: 7px 11px;
    border-radius: 999px;
    background: #edfdf6;
    border: 1px solid #c9f2df;
    color: #087f5b;
    font-size: 11.5px;
    font-weight: 750;
    transition: .2s ease;
  }

  .status-chip i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 0 4px rgba(16, 185, 129, .12);
  }

  .status-chip.paused {
    background: #fff8eb;
    border-color: #f8e3b7;
    color: #9a6700;
  }

  .status-chip.paused i {
    background: #f59e0b;
    box-shadow: 0 0 0 4px rgba(245, 158, 11, .12);
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 17px;
    align-items: center;
    margin: 16px 0 2px;
    color: var(--ink-soft);
    font-size: 12px;
    font-weight: 650;
  }

  .legend span { display: inline-flex; align-items: center; gap: 7px; }

  .legend-swatch {
    width: 22px;
    height: 4px;
    border-radius: 99px;
    display: inline-block;
  }

  .legend-swatch.truth { background: var(--teal); }

  .legend-swatch.raw {
    height: 3px;
    background: repeating-linear-gradient(90deg, rgba(245, 158, 11, .85) 0 4px, transparent 4px 7px);
  }

  .legend-swatch.filter {
    background: var(--indigo);
    box-shadow: 0 0 0 3px rgba(59, 91, 219, .08);
  }

  .chart-wrap {
    position: relative;
    height: 414px;
    margin-top: 1px;
    user-select: none;
  }

  #chart {
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
    touch-action: pan-y;
  }

  .chart-tooltip {
    position: absolute;
    z-index: 3;
    width: 184px;
    padding: 10px 11px;
    border-radius: 12px;
    border: 1px solid #dae5f1;
    background: rgba(255, 255, 255, .97);
    box-shadow: 0 12px 30px rgba(20, 44, 73, .14);
    pointer-events: none;
    font-size: 11.5px;
    color: var(--ink-soft);
    backdrop-filter: blur(8px);
  }

  .chart-tooltip[hidden] { display: none; }

  .tooltip-title {
    display: block;
    margin-bottom: 7px;
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .05em;
  }

  .tooltip-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 3px 0;
  }

  .tooltip-row span:first-child { display: inline-flex; align-items: center; gap: 6px; }
  .tooltip-row b { font-variant-numeric: tabular-nums; color: var(--ink); }
  .tip-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .tip-dot.truth { background: var(--teal); }
  .tip-dot.raw { background: var(--orange); }
  .tip-dot.filter { background: var(--indigo); }

  .metric-row {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 9px;
    margin-top: 9px;
  }

  .metric {
    min-width: 0;
    padding: 10px 12px;
    border-radius: 13px;
    background: #f7faff;
    border: 1px solid #e5edf6;
  }

  .metric-label {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 5px;
    color: var(--muted);
    font-size: 10.5px;
    white-space: nowrap;
  }

  .metric-value {
    display: flex;
    align-items: baseline;
    gap: 4px;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }

  .metric-value small {
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0;
  }

  .metric:nth-child(2) .metric-value { color: #b66a00; }
  .metric:nth-child(3) .metric-value { color: var(--indigo-deep); }

  .dot-key {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .dot-key.truth { background: var(--teal); }
  .dot-key.raw { background: var(--orange); }
  .dot-key.filter { background: var(--indigo); }
  .dot-key.neutral { background: #9bb0c5; }

  .error-strip {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 20px;
    margin-top: 10px;
    padding: 10px 13px;
    border-radius: 13px;
    background: linear-gradient(90deg, #f8fbff, #f4f8fd);
    border: 1px dashed #d9e5f1;
    color: var(--muted);
    font-size: 11.5px;
  }

  .error-strip strong {
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .error-pill {
    margin-left: auto;
    padding: 4px 9px;
    border-radius: 999px;
    background: #eafaf3;
    color: #087f5b;
    font-size: 10.5px;
    font-weight: 750;
    white-space: nowrap;
  }

  .error-pill.warn {
    background: #fff6e8;
    color: #a15c00;
  }

  /* ---------- 参数 ---------- */
  .controls {
    padding: 22px 24px 20px;
    align-self: start;
  }

  .controls h2 { margin-bottom: 2px; }

  .control {
    padding: 18px 0;
    border-top: 1px solid #e8eff7;
  }

  .control:first-of-type {
    padding-top: 16px;
    border-top: 0;
  }

  .control-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 11px;
  }

  .control-label label,
  .control-label-text {
    color: var(--ink-soft);
    font-size: 13px;
    font-weight: 750;
  }

  .control-label output {
    padding: 4px 8px;
    border-radius: 8px;
    background: #eef4fb;
    color: var(--ink);
    font-size: 12px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  input[type="range"] {
    --pct: 50%;
    --track: var(--indigo);
    -webkit-appearance: none;
    appearance: none;
    display: block;
    width: 100%;
    height: 6px;
    margin: 3px 0 0;
    border-radius: 999px;
    outline: none;
    background: linear-gradient(to right, var(--track) 0 var(--pct), #e3ebf4 var(--pct) 100%);
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    border: 4px solid var(--track);
    box-shadow: 0 2px 8px rgba(31, 56, 88, .2);
    transition: transform .15s ease;
  }

  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.12); }

  input[type="range"]::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    border: 4px solid var(--track);
    box-shadow: 0 2px 8px rgba(31, 56, 88, .2);
  }

  input[type="range"]:focus-visible {
    box-shadow: 0 0 0 4px rgba(59, 91, 219, .14);
  }

  .range-scale {
    display: flex;
    justify-content: space-between;
    margin-top: 7px;
    color: #9aacbe;
    font-size: 10px;
  }

  .mode-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 7px;
  }

  .mode-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 9px 4px 8px;
    border: 1px solid #dce6f1;
    border-radius: 11px;
    background: #f9fbfe;
    color: #536981;
    font: inherit;
    font-size: 11.5px;
    font-weight: 750;
    cursor: pointer;
    transition: border-color .18s ease, background .18s ease, color .18s ease, transform .18s ease;
  }

  .mode-btn:hover { border-color: #b8c8dc; transform: translateY(-1px); }

  .mode-btn .glyph {
    font-size: 19px;
    line-height: 1;
    color: #90a5ba;
    transition: color .18s ease;
  }

  .mode-btn.active {
    border-color: #8398ff;
    background: #eef2ff;
    color: #2f49b7;
    box-shadow: 0 0 0 3px rgba(59, 91, 219, .07);
  }

  .mode-btn.active .glyph { color: var(--indigo); }

  .button-row {
    display: grid;
    grid-template-columns: 1.15fr .85fr;
    gap: 8px;
    margin-top: 2px;
    padding-top: 16px;
    border-top: 1px solid #e8eff7;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    min-height: 42px;
    padding: 9px 12px;
    border-radius: 11px;
    border: 1px solid transparent;
    font: inherit;
    font-size: 12.5px;
    font-weight: 750;
    cursor: pointer;
    transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
  }

  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }

  .btn-primary {
    color: #fff;
    background: linear-gradient(135deg, #18375a, #0f2a47);
    box-shadow: 0 8px 18px rgba(15, 42, 71, .18);
  }

  .btn-primary:hover { box-shadow: 0 11px 24px rgba(15, 42, 71, .24); }

  .btn-secondary {
    color: var(--ink-soft);
    background: #f8fbff;
    border-color: #dbe6f1;
  }

  .btn-secondary:hover { background: #f0f6fd; }

  .btn .icon { font-size: 15px; line-height: 1; }

  footer {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    align-items: center;
    padding: 22px 4px 0;
    color: #8c9fb2;
    font-size: 11px;
  }

  footer strong { color: #60758b; }

  @media (max-width: 1180px) {
    .raw-stream .num-chip:nth-child(-n+2) { display: none; }
  }

  @media (max-width: 1080px) {
    .workbench { grid-template-columns: minmax(0, 1.6fr) minmax(330px, .8fr); }
    .hero { padding: 32px 36px; min-height: 210px; }
    .chart-wrap { height: 390px; }
    .raw-stream .num-chip:nth-child(-n+4) { display: none; }
    .avg-stream .avg-chip:nth-child(-n+2) { display: none; }
  }

  @media (max-width: 900px) {
    .page { padding: 18px 16px 36px; }
    .workbench { grid-template-columns: 1fr; }
    .chart-wrap { height: 360px; }
    .hero { padding: 30px 30px; }
    .demo-bottom { grid-template-columns: 1fr; }
    .raw-stream .num-chip:nth-child(-n+5) { display: none; }
    .avg-stream .avg-chip:nth-child(-n+3) { display: none; }
  }

  @media (max-width: 680px) {
    .hero {
      grid-template-columns: 1fr;
      gap: 16px;
      padding: 26px 24px;
      min-height: 0;
    }

    .hero h1 { font-size: clamp(36px, 10vw, 48px); }

    .hero-art {
      width: 110px;
      justify-self: end;
      margin-top: -4px;
    }

    .fixed-demo { padding: 16px 16px 15px; }
    .raw-stream .num-chip:nth-child(-n+6) { display: none; }
    .avg-stream .avg-chip:nth-child(-n+4) { display: none; }
    .num-chip, .avg-chip { height: 38px; font-size: 10.5px; }
    .avg-now strong { font-size: 22px; }

    .chart-panel, .controls { padding-left: 17px; padding-right: 17px; }
    .chart-wrap { height: 316px; }
    .metric-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .metric { padding: 9px 10px; }
    .metric-value { font-size: 16px; }
    .legend { gap: 11px; }
    .error-strip { gap: 7px 13px; }
    .error-pill { margin-left: 0; }
    .panel h2 { font-size: 20px; }

    footer { flex-direction: column; align-items: flex-start; gap: 6px; }
  }

  @media (max-width: 380px) {
    .hero-art { display: none; }
    .hero h1 { font-size: 34px; }
    .raw-stream .num-chip:nth-child(-n+6) { display: none; }
    .avg-stream .avg-chip:nth-child(-n+4) { display: none; }
    .num-chip, .avg-chip { font-size: 9.5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="hero">
    <h1>滑动窗口<em>滤波</em></h1>
    <div class="hero-art">
      <img src="可爱鲸鱼娘.png" alt="坐在碗里的鲸鱼娘">
    </div>
  </header>

  <main>
    <section class="fixed-demo" aria-label="滑动平均动画">
      <div class="demo-head">
        <span class="demo-label"><i class="live-dot"></i>原始数据</span>
        <span class="window-tag">窗口 5</span>
      </div>
      <div class="raw-stream" id="rawStream" aria-live="off"></div>

      <div class="demo-bottom">
        <div class="avg-now">
          <span>当前均值</span>
          <strong id="animAverage">—</strong>
        </div>
        <div class="avg-history">
          <div class="avg-head">
            <span class="demo-label">均值序列</span>
          </div>
          <div class="avg-stream" id="avgStream" aria-live="off"></div>
        </div>
      </div>
    </section>

    <section class="workbench" aria-label="交互实验台">
      <article class="panel chart-panel">
        <header class="panel-head">
          <h2>距离曲线</h2>
          <div class="status-chip" id="statusChip"><i></i><span id="statusText">运行中</span></div>
        </header>

        <div class="legend" aria-label="图例">
          <span><i class="legend-swatch truth"></i>实际值</span>
          <span><i class="legend-swatch raw"></i>传感器原始数据</span>
          <span><i class="legend-swatch filter"></i>滑动窗口滤波</span>
        </div>

        <div class="chart-wrap" id="chartWrap">
          <canvas id="chart" aria-label="实际距离、原始距离读数和滑动窗口滤波结果的实时曲线"></canvas>
          <div class="chart-tooltip" id="chartTooltip" hidden>
            <span class="tooltip-title">此刻的三个数值</span>
            <div class="tooltip-row"><span><i class="tip-dot truth"></i>实际值</span><b id="tipTruth">—</b></div>
            <div class="tooltip-row"><span><i class="tip-dot raw"></i>原始读数</span><b id="tipRaw">—</b></div>
            <div class="tooltip-row"><span><i class="tip-dot filter"></i>滤波输出</span><b id="tipFilter">—</b></div>
          </div>
        </div>

        <div class="metric-row">
          <div class="metric">
            <div class="metric-label"><i class="dot-key truth"></i>当前实际值</div>
            <div class="metric-value"><span id="currentActual">—</span><small>厘米</small></div>
          </div>
          <div class="metric">
            <div class="metric-label"><i class="dot-key raw"></i>最新原始读数</div>
            <div class="metric-value"><span id="currentRaw">—</span><small>厘米</small></div>
          </div>
          <div class="metric">
            <div class="metric-label"><i class="dot-key filter"></i>滤波输出</div>
            <div class="metric-value"><span id="currentFiltered">—</span><small>厘米</small></div>
          </div>
          <div class="metric">
            <div class="metric-label"><i class="dot-key neutral"></i>窗口内样本</div>
            <div class="metric-value"><span id="currentWindowCount">—</span><small>个</small></div>
          </div>
        </div>

        <div class="error-strip">
          <span>原始数据误差 <strong id="rawRmse">—</strong> 厘米</span>
          <span>滤波后误差 <strong id="filteredRmse">—</strong> 厘米</span>
          <span class="error-pill" id="errorPill">正在计算</span>
        </div>
      </article>

      <aside class="panel controls" aria-label="参数控制">
        <header class="panel-head">
          <h2>参数控制</h2>
        </header>

        <div class="control">
          <div class="control-label">
            <label for="baseRange">实际值中位数</label>
            <output id="baseOutput" for="baseRange">100 厘米</output>
          </div>
          <input id="baseRange" type="range" min="40" max="180" step="1" value="100" style="--track:#0f9d76">
          <div class="range-scale"><span>40 厘米</span><span>180 厘米</span></div>
        </div>

        <div class="control">
          <div class="control-label">
            <span class="control-label-text">实际值的变化方式</span>
          </div>
          <div class="mode-grid" role="group" aria-label="实际值的变化方式">
            <button class="mode-btn active" type="button" data-mode="constant" aria-pressed="true">
              <span class="glyph">━</span>
              <span>保持不变</span>
            </button>
            <button class="mode-btn" type="button" data-mode="wave" aria-pressed="false">
              <span class="glyph">∿</span>
              <span>缓慢波动</span>
            </button>
            <button class="mode-btn" type="button" data-mode="jump" aria-pressed="false">
              <span class="glyph">↗</span>
              <span>突然增大</span>
            </button>
          </div>
        </div>

        <div class="control">
          <div class="control-label">
            <label for="noiseRange">高斯噪声标准差 σ</label>
            <output id="noiseOutput" for="noiseRange">3.0 厘米</output>
          </div>
          <input id="noiseRange" type="range" min="0" max="12" step="0.5" value="3" style="--track:#f59e0b">
          <div class="range-scale"><span>0 厘米</span><span>12 厘米</span></div>
        </div>

        <div class="control">
          <div class="control-label">
            <label for="windowRange">滑动窗口大小 N</label>
            <output id="windowOutput" for="windowRange">9 个样本</output>
          </div>
          <input id="windowRange" type="range" min="1" max="41" step="1" value="9" style="--track:#3b5bdb">
          <div class="range-scale"><span>1</span><span>41</span></div>
        </div>

        <div class="button-row">
          <button class="btn btn-primary" id="pauseBtn" type="button"><span class="icon" id="pauseIcon">Ⅱ</span><span id="pauseText">暂停演示</span></button>
          <button class="btn btn-secondary" id="resetBtn" type="button"><span class="icon">↺</span>重新演示</button>
        </div>
      </aside>
    </section>
  </main>

  <footer>
    <span><strong>机器人队教学演示</strong> · 滑动窗口滤波</span>
    <span>所有数据均在浏览器中实时生成</span>
  </footer>
</div>

<script>
(() => {
  "use strict";

  const SAMPLE_DT = 0.1;
  const VIEW_SPAN = 22;
  const PREFILL_SPAN = 22;
  const WAVE_AMP = 16;
  const WAVE_PERIOD = 14;
  const JUMP_AT = 5;
  const JUMP_SIZE = 55;
  const KEEP_SPAN = 30;
  const FONT = '"Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif';

  const COLORS = {
    ink: "#10243e",
    muted: "#6a7f97",
    grid: "#e6eef7",
    gridStrong: "#d8e4f0",
    plotBg: "#f9fbfe",
    truth: "#0f9d76",
    raw: "#f59e0b",
    filter: "#3b5bdb",
    filterDeep: "#2b45ab",
    orange: "#d97706"
  };

  const state = {
    base: 100,
    mode: "constant",
    noise: 3,
    windowN: 9,
    running: true,
    simTime: 0,
    nextSampleAt: SAMPLE_DT,
    series: [],
    hoverPoint: null,
    yRange: { min: 80, max: 120 },
    lastFrame: performance.now(),
    lastUI: 0
  };

  const $ = (id) => document.getElementById(id);
  const chart = $("chart");
  const chartCtx = chart.getContext("2d");
  const tooltip = $("chartTooltip");
  const rawStream = $("rawStream");
  const avgStream = $("avgStream");
  const animAverage = $("animAverage");

  function gaussian() {
    let u = 0;
    let v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  /* ---------- 固定滑动平均动画 ---------- */
  const fixedDemo = {
    raw: [],
    avg: [],
    rawSlots: 11,
    avgSlots: 9,
    windowSize: 5
  };

  function fixedRawValue() {
    return 100 + gaussian() * 8;
  }

  function fixedAverage(values) {
    return values.reduce((sum, value) => sum + value, 0) / values.length;
  }

  function renderFixedDemo(initial) {
    rawStream.innerHTML = fixedDemo.raw.map((value, index) => {
      const inWindow = index >= fixedDemo.raw.length - fixedDemo.windowSize;
      const isNew = !initial && index === fixedDemo.raw.length - 1;
      return `<span class="num-chip${inWindow ? " in-window" : ""}${isNew ? " chip-enter" : ""}">${value.toFixed(1)}</span>`;
    }).join("");

    avgStream.innerHTML = fixedDemo.avg.map((value, index) => {
      const isNew = !initial && index === fixedDemo.avg.length - 1;
      return `<span class="avg-chip${isNew ? " chip-enter" : ""}">${value.toFixed(1)}</span>`;
    }).join("");

    animAverage.textContent = fixedDemo.avg[fixedDemo.avg.length - 1].toFixed(1);
  }

  function initFixedDemo() {
    const seed = [];
    for (let i = 0; i < fixedDemo.rawSlots + fixedDemo.windowSize - 1; i += 1) {
      seed.push(fixedRawValue());
    }

    const averages = [];
    for (let i = fixedDemo.windowSize - 1; i < seed.length; i += 1) {
      averages.push(fixedAverage(seed.slice(i - fixedDemo.windowSize + 1, i + 1)));
    }

    fixedDemo.raw = seed.slice(-fixedDemo.rawSlots);
    fixedDemo.avg = averages.slice(-fixedDemo.avgSlots);
    renderFixedDemo(true);

    window.setInterval(() => {
      fixedDemo.raw.push(fixedRawValue());
      if (fixedDemo.raw.length > fixedDemo.rawSlots) fixedDemo.raw.shift();

      const average = fixedAverage(fixedDemo.raw.slice(-fixedDemo.windowSize));
      fixedDemo.avg.push(average);
      if (fixedDemo.avg.length > fixedDemo.avgSlots) fixedDemo.avg.shift();

      renderFixedDemo(false);
    }, 900);
  }

  /* ---------- 距离数据 ---------- */
  function actualAt(t) {
    if (state.mode === "wave") {
      return state.base + WAVE_AMP * Math.sin((2 * Math.PI * t) / WAVE_PERIOD);
    }
    if (state.mode === "jump" && t >= JUMP_AT) {
      return state.base + JUMP_SIZE;
    }
    return state.base;
  }

  function computeYRange() {
    const amp = state.mode === "wave" ? WAVE_AMP : 0;
    const jump = state.mode === "jump" ? JUMP_SIZE : 0;
    const noisePad = Math.max(6, state.noise * 3.6);
    let lo = state.base - amp - noisePad;
    let hi = state.base + amp + jump + noisePad;
    lo = Math.max(0, Math.floor(lo / 20) * 20);
    hi = Math.ceil(hi / 20) * 20;
    if (hi - lo < 40) {
      const mid = (hi + lo) / 2;
      lo = Math.max(0, Math.floor((mid - 20) / 20) * 20);
      hi = Math.ceil((mid + 20) / 20) * 20;
    }
    return { min: lo, max: hi };
  }

  function recomputeFiltered() {
    const data = state.series;
    const N = state.windowN;
    for (let i = 0; i < data.length; i += 1) {
      let sum = 0;
      let count = 0;
      const start = Math.max(0, i - N + 1);
      for (let j = start; j <= i; j += 1) {
        sum += data[j].raw;
        count += 1;
      }
      data[i].filtered = count ? sum / count : data[i].raw;
    }
  }

  function makePoint(t) {
    const actual = actualAt(t);
    const raw = Math.max(1, actual + state.noise * gaussian());
    return { t, actual, raw, filtered: raw };
  }

  function appendPoint(point) {
    state.series.push(point);
    const N = state.windowN;
    let sum = 0;
    let count = 0;
    for (let i = state.series.length - 1; i >= 0 && count < N; i -= 1) {
      sum += state.series[i].raw;
      count += 1;
    }
    point.filtered = count ? sum / count : point.raw;

    const cutoff = point.t - KEEP_SPAN;
    while (state.series.length && state.series[0].t < cutoff) {
      state.series.shift();
    }
  }

  function resetSimulation() {
    state.simTime = 0;
    state.nextSampleAt = SAMPLE_DT;
    state.series = [];
    state.hoverPoint = null;
    tooltip.hidden = true;

    const total = Math.round(PREFILL_SPAN / SAMPLE_DT);
    for (let i = 0; i <= total; i += 1) {
      const t = -PREFILL_SPAN + i * SAMPLE_DT;
      state.series.push(makePoint(t));
    }
    recomputeFiltered();
    state.yRange = computeYRange();
    state.lastFrame = performance.now();
    state.lastUI = 0;
    updateReadouts(true);
  }

  function formatNumber(value, digits = 1) {
    if (!Number.isFinite(value)) return "—";
    return value.toFixed(digits);
  }

  function computeErrors() {
    const cutoff = state.simTime - VIEW_SPAN;
    let rawSum = 0;
    let filteredSum = 0;
    let count = 0;
    for (const point of state.series) {
      if (point.t < cutoff) continue;
      const rawError = point.raw - point.actual;
      const filteredError = point.filtered - point.actual;
      rawSum += rawError * rawError;
      filteredSum += filteredError * filteredError;
      count += 1;
    }
    if (!count) return { raw: 0, filtered: 0 };
    return {
      raw: Math.sqrt(rawSum / count),
      filtered: Math.sqrt(filteredSum / count)
    };
  }

  function updateReadouts(force = false) {
    if (!state.series.length) return;
    const now = performance.now();
    if (!force && now - state.lastUI < 140) return;
    state.lastUI = now;

    const latest = state.series[state.series.length - 1];
    $("currentActual").textContent = formatNumber(latest.actual);
    $("currentRaw").textContent = formatNumber(latest.raw);
    $("currentFiltered").textContent = formatNumber(latest.filtered);
    $("currentWindowCount").textContent = String(Math.min(state.windowN, state.series.length));

    const errors = computeErrors();
    $("rawRmse").textContent = formatNumber(errors.raw);
    $("filteredRmse").textContent = formatNumber(errors.filtered);

    const pill = $("errorPill");
    pill.classList.remove("warn");
    if (state.noise === 0) {
      pill.textContent = "无噪声：只剩窗口延迟";
      pill.classList.add("warn");
    } else if (state.windowN === 1) {
      pill.textContent = "窗口为 1：没有平滑";
      pill.classList.add("warn");
    } else if (errors.raw > 0.02) {
      const change = 1 - errors.filtered / errors.raw;
      if (change >= 0) {
        pill.textContent = `误差下降 ${Math.round(change * 100)}%`;
      } else {
        pill.textContent = `误差增加 ${Math.round(-change * 100)}%`;
        pill.classList.add("warn");
      }
    } else {
      pill.textContent = "误差接近零";
      pill.classList.add("warn");
    }
  }

  function fitCanvas(canvas, ctx) {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const width = Math.max(1, rect.width);
    const height = Math.max(1, rect.height);
    const targetW = Math.round(width * dpr);
    const targetH = Math.round(height * dpr);
    if (canvas.width !== targetW || canvas.height !== targetH) {
      canvas.width = targetW;
      canvas.height = targetH;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { width, height };
  }

  function roundRect(ctx, x, y, w, h, r) {
    const radius = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
  }

  function getChartPadding(width) {
    if (width < 560) return { left: 47, right: 17, top: 19, bottom: 34 };
    return { left: 58, right: 26, top: 22, bottom: 38 };
  }

  function drawChart() {
    const { width, height } = fitCanvas(chart, chartCtx);
    const ctx = chartCtx;
    const pad = getChartPadding(width);
    const plotW = Math.max(1, width - pad.left - pad.right);
    const plotH = Math.max(1, height - pad.top - pad.bottom);
    const yRange = state.yRange;
    const tEnd = state.simTime;
    const tStart = tEnd - VIEW_SPAN;

    ctx.clearRect(0, 0, width, height);

    roundRect(ctx, pad.left, pad.top, plotW, plotH, 13);
    ctx.fillStyle = COLORS.plotBg;
    ctx.fill();

    const xOf = (t) => pad.left + ((t - tStart) / VIEW_SPAN) * plotW;
    const yOf = (v) => pad.top + (1 - (v - yRange.min) / (yRange.max - yRange.min)) * plotH;

    ctx.font = `500 10.5px ${FONT}`;
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    const yTicks = 5;
    for (let i = 0; i <= yTicks; i += 1) {
      const value = yRange.min + ((yRange.max - yRange.min) * i) / yTicks;
      const y = yOf(value);
      ctx.beginPath();
      ctx.moveTo(pad.left, y);
      ctx.lineTo(pad.left + plotW, y);
      ctx.strokeStyle = i === 0 ? COLORS.gridStrong : COLORS.grid;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = COLORS.muted;
      ctx.fillText(String(Math.round(value)), pad.left - 9, y);
    }

    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    const xOffsets = [-20, -15, -10, -5, 0];
    for (const offset of xOffsets) {
      const x = xOf(tEnd + offset);
      if (x < pad.left - 1 || x > pad.left + plotW + 1) continue;
      ctx.beginPath();
      ctx.moveTo(x, pad.top);
      ctx.lineTo(x, pad.top + plotH);
      ctx.strokeStyle = offset === 0 ? "#d5e2ef" : COLORS.grid;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = offset === 0 ? "#70869c" : COLORS.muted;
      ctx.fillText(offset === 0 ? "现在" : `${offset} 秒`, x, pad.top + plotH + 11);
    }

    ctx.save();
    ctx.beginPath();
    ctx.rect(pad.left, pad.top, plotW, plotH);
    ctx.clip();

    const visible = state.series.filter((p) => p.t >= tStart - 0.2 && p.t <= tEnd + 0.2);

    if (visible.length) {
      ctx.beginPath();
      visible.forEach((point, index) => {
        const x = xOf(point.t);
        const y = yOf(point.raw);
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = "rgba(245, 158, 11, .36)";
      ctx.lineWidth = 1.15;
      ctx.lineJoin = "round";
      ctx.stroke();

      ctx.fillStyle = "rgba(245, 158, 11, .63)";
      for (const point of visible) {
        ctx.beginPath();
        ctx.arc(xOf(point.t), yOf(point.raw), 1.55, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    if (visible.length) {
      ctx.beginPath();
      visible.forEach((point, index) => {
        const x = xOf(point.t);
        const y = yOf(point.actual);
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = COLORS.truth;
      ctx.lineWidth = 2.25;
      ctx.lineJoin = "round";
      ctx.setLineDash([7, 5]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    if (visible.length) {
      ctx.beginPath();
      visible.forEach((point, index) => {
        const x = xOf(point.t);
        const y = yOf(point.filtered);
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = COLORS.filter;
      ctx.lineWidth = 3.15;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.shadowColor = "rgba(59, 91, 219, .22)";
      ctx.shadowBlur = 8;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    if (state.mode === "jump") {
      const jumpX = xOf(JUMP_AT);
      if (jumpX >= pad.left && jumpX <= pad.left + plotW) {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(jumpX, pad.top);
        ctx.lineTo(jumpX, pad.top + plotH);
        ctx.strokeStyle = "rgba(217, 119, 6, .55)";
        ctx.lineWidth = 1.4;
        ctx.setLineDash([4, 5]);
        ctx.stroke();
        ctx.setLineDash([]);

        const label = "实际值突然增大";
        const labelW = 101;
        let labelX = jumpX + 7;
        if (labelX + labelW > pad.left + plotW - 4) labelX = jumpX - labelW - 7;
        const labelY = pad.top + 7;
        roundRect(ctx, labelX, labelY, labelW, 21, 7);
        ctx.fillStyle = "rgba(255, 249, 239, .95)";
        ctx.fill();
        ctx.strokeStyle = "rgba(245, 158, 11, .3)";
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = "#9a6700";
        ctx.font = `700 10.5px ${FONT}`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(label, labelX + labelW / 2, labelY + 10.7);
        ctx.restore();
      }
    }

    if (visible.length) {
      const last = visible[visible.length - 1];
      const lx = xOf(last.t);
      const fy = yOf(last.filtered);
      const ry = yOf(last.raw);

      ctx.beginPath();
      ctx.arc(lx, ry, 2.4, 0, Math.PI * 2);
      ctx.fillStyle = COLORS.raw;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(lx, fy, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = "#fff";
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = COLORS.filter;
      ctx.stroke();
    }

    if (state.hoverPoint) {
      const point = state.hoverPoint;
      const hx = xOf(point.t);
      if (hx >= pad.left && hx <= pad.left + plotW) {
        ctx.beginPath();
        ctx.moveTo(hx, pad.top);
        ctx.lineTo(hx, pad.top + plotH);
        ctx.strokeStyle = "rgba(38, 62, 91, .22)";
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 4]);
        ctx.stroke();
        ctx.setLineDash([]);

        const dots = [
          { y: yOf(point.actual), color: COLORS.truth },
          { y: yOf(point.raw), color: COLORS.orange },
          { y: yOf(point.filtered), color: COLORS.filter }
        ];
        for (const dot of dots) {
          ctx.beginPath();
          ctx.arc(hx, dot.y, 4, 0, Math.PI * 2);
          ctx.fillStyle = "#fff";
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = dot.color;
          ctx.stroke();
        }
      }
    }

    ctx.restore();

    roundRect(ctx, pad.left, pad.top, plotW, plotH, 13);
    ctx.strokeStyle = "#dfe9f4";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = COLORS.muted;
    ctx.font = `600 10px ${FONT}`;
    ctx.textAlign = "left";
    ctx.textBaseline = "bottom";
    ctx.fillText("距离 / 厘米", pad.left + 2, pad.top - 6);
    ctx.textAlign = "right";
    ctx.fillText("时间", pad.left + plotW, pad.top - 6);
  }

  function pointerToPoint(event) {
    const rect = chart.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const width = rect.width;
    const pad = getChartPadding(width);
    if (x < pad.left || x > width - pad.right) return null;

    const tStart = state.simTime - VIEW_SPAN;
    const t = tStart + ((x - pad.left) / Math.max(1, width - pad.left - pad.right)) * VIEW_SPAN;

    let best = null;
    let bestDistance = Infinity;
    for (const point of state.series) {
      const distance = Math.abs(point.t - t);
      if (distance < bestDistance) {
        bestDistance = distance;
        best = point;
      }
    }
    if (!best || bestDistance > 0.35) return null;
    return { point: best, x, rect };
  }

  function handlePointerMove(event) {
    const result = pointerToPoint(event);
    if (!result) {
      state.hoverPoint = null;
      tooltip.hidden = true;
      return;
    }
    const { point, x, rect } = result;
    state.hoverPoint = point;
    $("tipTruth").textContent = `${formatNumber(point.actual)} 厘米`;
    $("tipRaw").textContent = `${formatNumber(point.raw)} 厘米`;
    $("tipFilter").textContent = `${formatNumber(point.filtered)} 厘米`;

    const maxLeft = Math.max(8, rect.width - 194);
    tooltip.style.left = `${Math.min(maxLeft, Math.max(8, x + 13))}px`;
    tooltip.style.top = "11px";
    tooltip.hidden = false;
  }

  function clearPointer() {
    state.hoverPoint = null;
    tooltip.hidden = true;
  }

  function setRangeFill(input) {
    const value = Number(input.value);
    const min = Number(input.min);
    const max = Number(input.max);
    const pct = ((value - min) / (max - min)) * 100;
    input.style.setProperty("--pct", `${pct}%`);
  }

  function updateModeUI(mode) {
    document.querySelectorAll(".mode-btn").forEach((button) => {
      const active = button.dataset.mode === mode;
      button.classList.toggle("active", active);
      button.setAttribute("aria-pressed", String(active));
    });
  }

  function setStatus() {
    const chip = $("statusChip");
    chip.classList.toggle("paused", !state.running);
    $("statusText").textContent = state.running ? "运行中" : "已暂停";
    $("pauseText").textContent = state.running ? "暂停演示" : "继续演示";
    $("pauseIcon").textContent = state.running ? "Ⅱ" : "▶";
  }

  function bindEvents() {
    const baseRange = $("baseRange");
    const noiseRange = $("noiseRange");
    const windowRange = $("windowRange");

    baseRange.addEventListener("input", () => {
      state.base = Number(baseRange.value);
      $("baseOutput").textContent = `${state.base} 厘米`;
      setRangeFill(baseRange);
      resetSimulation();
    });

    noiseRange.addEventListener("input", () => {
      state.noise = Number(noiseRange.value);
      $("noiseOutput").textContent = `${state.noise.toFixed(1)} 厘米`;
      setRangeFill(noiseRange);
      resetSimulation();
    });

    windowRange.addEventListener("input", () => {
      state.windowN = Number(windowRange.value);
      $("windowOutput").textContent = `${state.windowN} 个样本`;
      setRangeFill(windowRange);
      recomputeFiltered();
      updateReadouts(true);
    });

    document.querySelectorAll(".mode-btn").forEach((button) => {
      button.addEventListener("click", () => {
        state.mode = button.dataset.mode;
        updateModeUI(state.mode);
        resetSimulation();
      });
    });

    $("pauseBtn").addEventListener("click", () => {
      state.running = !state.running;
      state.lastFrame = performance.now();
      setStatus();
    });

    $("resetBtn").addEventListener("click", () => {
      state.running = true;
      setStatus();
      resetSimulation();
    });

    chart.addEventListener("pointermove", handlePointerMove);
    chart.addEventListener("pointerleave", clearPointer);
    chart.addEventListener("pointercancel", clearPointer);

    [baseRange, noiseRange, windowRange].forEach(setRangeFill);
    updateModeUI(state.mode);
    setStatus();
  }

  function loop(now) {
    const dt = Math.min((now - state.lastFrame) / 1000, 0.08);
    state.lastFrame = now;

    if (state.running) {
      state.simTime += dt;
      while (state.nextSampleAt <= state.simTime + 1e-9) {
        appendPoint(makePoint(state.nextSampleAt));
        state.nextSampleAt += SAMPLE_DT;
      }
    }

    drawChart();
    updateReadouts();
    requestAnimationFrame(loop);
  }

  initFixedDemo();
  bindEvents();
  resetSimulation();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
